spring.datasource.url=${TEST_DATABASE_URL:jdbc:h2:mem:dndacademy;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000}
spring.datasource.username=${TEST_DATABASE_USER:sa}
spring.datasource.password=${TEST_DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.config.import=classpath:management.yaml
app.mail.provider=smtp
app.mail.from=sender@example.test
app.mail.smtp.host=127.0.0.1
app.mail.smtp.port=1
app.mail.smtp.username=test
app.mail.smtp.password=test
app.mail.worker-enabled=false
JWT_SECRET=isolated-test-key-0123456789abcdef0123456789abcdef
JWT_EXPIRATION=3600000
APP_FRONTEND_BASE_URL=http://localhost:3000
app.frontend-base-url=http://localhost:3000
app.cors.allow-local-origins=true
cloudinary.cloud-name=test
cloudinary.api-key=test
cloudinary.api-secret=test
logging.level.root=WARN
